# Benchmark settings for this experiment. Read by scripts/run.sh (bash syntax).
# Every value can be overridden from the command line, for example:
#   SIZES="64 128" REPS=3 bash scripts/run.sh experiments/01-matrix-multiplication timings

# CMake target to build and run.
TARGET=matrix_multiplication

# Versions to compare. Each one is passed to the program as its first argument.
VARIANTS="naive row_wise tiled"

# Problem sizes (matrix dimension n).
: "${SIZES:=64 128 256 512 1024}"

# Timed repetitions: REPS below LARGE_FROM, REPS_LARGE from LARGE_FROM upwards.
: "${REPS:=7}"
: "${REPS_LARGE:=5}"
: "${LARGE_FROM:=1024}"

# Extra program arguments after <variant> <size> <repetitions>: here the tile size.
: "${EXTRA_ARGS:=32}"

# Sizes for the cache_counters check. Leave empty to skip it.
: "${COUNTER_SIZES:=512 1024}"

# Size for the no_vectorization check. Leave empty to skip it.
: "${NOVEC_SIZE:=512}"

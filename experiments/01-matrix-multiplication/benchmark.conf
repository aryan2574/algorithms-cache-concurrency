# Benchmark settings for this experiment. Read by scripts/run.sh (bash syntax).
# Every value except TARGET can be overridden from the command line, for example:
#   SIZES="64 128" REPS=3 bash scripts/run.sh experiments/01-matrix-multiplication timings

# CMake target to build and run.
TARGET=matrix_multiplication

# Versions to compare. Each one is passed to the program as its first argument.
: "${VARIANTS:=naive row_wise tiled}"

# Problem sizes (matrix dimension n).
: "${SIZES:=64 128 256 512 1024}"

# Timed repetitions: REPS below LARGE_FROM, REPS_LARGE from LARGE_FROM upwards.
: "${REPS:=7}"
: "${REPS_LARGE:=5}"
: "${LARGE_FROM:=1024}"

# Extra program arguments after <variant> <size> <repetitions>: here the tile size.
: "${EXTRA_ARGS:=32}"

# Sizes for the cache_counters check. Leave empty to skip it.
: "${COUNTER_SIZES:=512 1024}"

# Runs measured per counter value. Under WSL2 the counts are noisy; use 30 or more
# for n <= 512 (a check: l1_loads_per_run should be about 1.5 * n^3 for every version).
: "${COUNTER_RUNS:=3}"

# Versions for the cache_counters check, and the tile sizes for the versions that take one.
# naive is skipped from TILE_SWEEP_NAIVE_REFERENCE_MAX on (it takes minutes there).
: "${COUNTER_VERSIONS:=naive row_wise col_wise tiled tiled_col_major tiled_tile_wise oblivious_row_major oblivious_col_major oblivious_tile_wise}"
: "${COUNTER_PARAMS:=32 128}"

# Size for the no_vectorization check. Leave empty to skip it.
: "${NOVEC_SIZE:=512}"

# --- tile_sweep check ---
# Tile sizes to compare (the tiled version is run once per tile size).
# Leave empty to skip the tile_sweep check.
: "${TILE_SIZES:=4 8 16 32 64 128 256 512}"

# Versions swept over the tile sizes (see main.cpp): tiled = row-major layout,
# tiled_tile_wise = tile-wise layout (each tile contiguous), tiled_col_major = column-major.
# Tile-wise versions skip tile sizes that do not divide n (for example T=512 at n=256).
: "${TILE_SWEEP_VERSIONS:=tiled tiled_tile_wise}"

# Matrix sizes for the sweep. Chosen to cover the cases on this machine
# (L1d 32 KiB, L2 512 KiB, L3 4 MiB; one matrix of doubles is 8*n*n bytes):
#   256   matrix (512 KiB) fits L2
#   512   matrix (2 MiB) fits L3 only
#   1024  matrix (8 MiB) larger than L3, one row (8 KiB) fits L1
#   2048  matrix (32 MiB), one row (16 KiB) still fits L1, two rows nearly fill it
# For "one row larger than L1" (n >= 4096) run it separately, it takes a while:
#   TILE_SWEEP_SIZES="4096" bash scripts/run.sh experiments/01-matrix-multiplication tile_sweep
: "${TILE_SWEEP_SIZES:=256 512 1024 2048}"

# The program checks every result against a reference before timing. `naive` is the
# textbook reference, but it takes minutes for large n, so from sizes above this
# limit the (much faster) row_wise version is the reference instead.
# (Used by tile_sweep and oblivious.)
: "${TILE_SWEEP_NAIVE_REFERENCE_MAX:=1024}"

# --- oblivious check ---
# Cache-oblivious vs cache-aware multiplication on row-major, column-major and tile-wise layouts.
# The parameter list is used as: tile size for the cache-aware versions and for the tile-wise
# layout, smallest block of the recursion for the row-major / column-major oblivious versions.
# Leave empty to skip the oblivious check.
: "${OBLIVIOUS_PARAMS:=32 64 128}"
: "${OBLIVIOUS_SIZES:=256 512 1024 2048}"

# Benchmark settings for merge sort (recursive vs iterative). Read by scripts/run.sh.
# Override from the command line, for example:
#   SIZES="1024 4096" REPS=3 bash scripts/run.sh experiments/02-merge-sort timings

TARGET=merge_sort

# Versions to compare (passed as the program's first argument).
: "${VARIANTS:=recursive iterative}"

# Array lengths. Powers of 2, spanning the cache hierarchy on this machine
# (int64 elements, 8 bytes; working set ≈ 2 arrays = 16*n bytes with the temp buffer):
#   1024       16 KiB   fits L1
#   4096       64 KiB   past L1, fits L2
#   16384     256 KiB   fits L2
#   65536       1 MiB   past L2, fits L3
#   262144      4 MiB   around L3
#   1048576    16 MiB   past L3
#   4194304    64 MiB   well past L3
#   16777216  256 MiB   large (optional; override SIZES to include it)
: "${SIZES:=1024 4096 16384 65536 262144 1048576 4194304}"

: "${REPS:=7}"
: "${REPS_LARGE:=5}"
: "${LARGE_FROM:=1048576}"

# No tile size; keep empty so run_variant only passes <variant> <size> <reps>.
: "${EXTRA_ARGS:=}"

# Cache counters. Leave empty to skip. Smaller set than timings (perf is slower).
: "${COUNTER_SIZES:=65536 262144 1048576 4194304}"
: "${COUNTER_RUNS:=5}"
: "${COUNTER_VERSIONS:=recursive iterative}"
: "${COUNTER_PARAMS:=}"
: "${COUNTER_REFERENCE:=recursive}"

# Merge is comparison-based; SIMD matters little. Leave empty to skip.
: "${NOVEC_SIZE:=}"

# Unused by this experiment (matrix-multiplication checks).
: "${TILE_SIZES:=}"
: "${OBLIVIOUS_PARAMS:=}"
: "${TRANSPOSE_SIZES:=}"
